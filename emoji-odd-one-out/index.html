<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>틀린 이모지 찾기 챌린지 | 100개 중 딱 하나, 5초 안에 찾아봐!</title>
<meta name="description" content="똑같아 보이는 이모지 격자 속에서 미묘하게 다른 하나를 찾는 눈썰미 게임. 30초 타임어택, 오늘의 챌린지, 결과 카드와 도전장 링크로 친구와 점수 대결!">
<meta name="theme-color" content="#FFB400">
<meta property="og:type" content="website">
<meta property="og:title" content="틀린 이모지 찾기 챌린지 👀🔍">
<meta property="og:description" content="똑같아 보이는 이모지 100개 중 딱 하나 다른 놈, 5초 안에 찾아낼 수 있나요? 이 점수 깰 수 있어?">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🔍%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --y:#FFB400; --y2:#FFD25E; --ink:#2B1B00; --bg:#FFF4D1; --pink:#D6336C; --blue:#2F6FED; --green:#16A34A; --red:#D92D20;
  --size:min(92vw,520px,60vh);
  --font:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  font-family:var(--font);color:var(--ink);font-size:17px;line-height:1.45;
  background:var(--bg);
  background-image:radial-gradient(rgba(255,180,0,.35) 2px,transparent 2.5px);
  background-size:26px 26px;
}
button,input{font-family:inherit;color:inherit;touch-action:manipulation}
:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;max-width:760px;width:100%;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;font-size:1.1rem}
.brand b{background:var(--y);border:3px solid var(--ink);border-radius:12px;padding:2px 9px;box-shadow:0 3px 0 var(--ink)}
.icon-btn{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-size:1.3rem;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.icon-btn:active{transform:translateY(3px);box-shadow:none}
main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:0 16px 28px}
h1{font-size:clamp(2rem,8vw,3.2rem);line-height:1.1;margin:.2em 0 .25em;text-align:center;letter-spacing:-.5px}
h1 span{display:inline-block;background:var(--y);padding:0 .25em;border:4px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);transform:rotate(-2deg)}
.tag{text-align:center;margin:0 auto 14px;max-width:520px}
.demo{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;width:min(260px,70vw);margin:10px auto 18px;padding:10px;background:#fff;border:4px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);font-family:var(--emoji);font-size:clamp(1.4rem,7vw,2rem);text-align:center;line-height:1.25}
.demo i{font-style:normal}
.demo i.odd{animation:wig 2.4s infinite}
@keyframes wig{0%,80%,100%{transform:none}85%{transform:rotate(-14deg) scale(1.25)}92%{transform:rotate(14deg) scale(1.25)}}
.panel{background:#fff;border:4px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);padding:16px;margin:14px 0}
.panel h2{margin:0 0 10px;font-size:1.2rem}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{border:3px solid var(--ink);border-radius:16px;background:#fff;padding:8px 2px;cursor:pointer;font-size:1rem;box-shadow:0 3px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px}
.chip .e{font-size:1.7rem;font-family:var(--emoji);line-height:1.2}
.chip[aria-pressed="true"]{background:var(--y);transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:10px 22px;font-size:1.2rem;border:4px solid var(--ink);border-radius:18px;background:var(--y);cursor:pointer;box-shadow:0 6px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{background:var(--y2)}
.btn:active{transform:translateY(6px);box-shadow:0 0 0 var(--ink)}
.btn.alt{background:#fff}.btn.alt:hover{background:#f6f6f6}
.btn.pink{background:var(--pink);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.pink:hover{background:#C02A60}
.btn.block{width:100%}
.row{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0}
.row .btn{flex:1 1 200px}
.hint{font-size:.92rem;margin:8px 0 0;text-align:center}
ol.rank{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ol.rank li{display:flex;justify-content:space-between;gap:8px;background:var(--bg);border:2px solid var(--ink);border-radius:12px;padding:6px 12px}
.muted{opacity:.78}
.banner{background:var(--pink);color:#fff;border:4px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:14px 16px;margin:10px 0;text-align:center}
.banner p{margin:0 0 10px;text-shadow:0 2px 0 rgba(0,0,0,.35);font-size:1.1rem}
.banner .btn{background:#fff;color:var(--ink)}
/* game */
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:6px auto 8px;width:var(--size)}
.pill{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:2px 12px;font-size:1rem;white-space:nowrap;justify-self:start}
.pill.r{justify-self:end}
.time{font-size:2.2rem;line-height:1;text-align:center;min-width:5ch;font-variant-numeric:tabular-nums}
.time.low{color:var(--red);animation:pulse .5s infinite alternate}
.time.hit{animation:hit .4s}
@keyframes pulse{to{transform:scale(1.12)}}
@keyframes hit{0%,100%{transform:none}30%{transform:translateX(-8px) scale(1.2);color:var(--red)}60%{transform:translateX(8px) scale(1.2);color:var(--red)}}
.bar{width:var(--size);height:16px;margin:0 auto 10px;background:#fff;border:3px solid var(--ink);border-radius:99px;overflow:hidden}
.bar div{height:100%;width:100%;background:var(--green);transition:width .06s linear,background .2s}
.bar div.low{background:var(--red)}
.gridwrap{position:relative;width:var(--size);margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:2px;padding:8px;background:#fff;border:4px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink)}
.grid.shake{animation:shake .3s}
.grid.ok{animation:okf .25s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes okf{50%{background:#d9ffe4}}
.cell{aspect-ratio:1;min-width:0;display:grid;place-items:center;padding:0;border:0;border-radius:8px;background:transparent;cursor:pointer;font-family:var(--emoji);line-height:1;font-size:calc((var(--size) - 24px) / var(--n) * .66)}
@media (hover:hover){.cell:hover{background:#fff1c2}}
.cell.wrong{background:#ffd0cc;outline:3px solid var(--red)}
.float{position:absolute;left:50%;top:-6px;transform:translateX(-50%);pointer-events:none;font-size:1.6rem;animation:fl .8s forwards;text-shadow:0 2px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff}
@keyframes fl{to{transform:translate(-50%,-34px);opacity:0}}
.gamefoot{display:flex;justify-content:space-between;align-items:center;width:var(--size);margin:14px auto 0;font-size:.95rem}
.link{background:none;border:0;text-decoration:underline;cursor:pointer;font-size:.95rem;padding:8px}
/* result */
.card{text-align:center;background:var(--y);border:4px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:20px 16px;margin-top:6px}
.card .big{font-family:var(--emoji);font-size:5rem;line-height:1.1;animation:pop .6s}
@keyframes pop{0%{transform:scale(.3) rotate(-20deg)}70%{transform:scale(1.2)}100%{transform:none}}
.card h2{font-size:2.1rem;margin:.1em 0}
.card h2:focus{outline:none}
.card .score{font-size:3.2rem;line-height:1;margin:6px 0}
.card .sub{margin:2px 0}
.badge{display:inline-block;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:2px 14px;margin:4px 3px}
.vs{background:#fff;border:3px dashed var(--ink);border-radius:14px;padding:8px;margin:10px 0 0}
.namebox{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0 0}
.namebox input{border:3px solid var(--ink);border-radius:12px;padding:8px 12px;font-size:1rem;width:11em;background:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
footer{text-align:center;font-size:.85rem;padding:14px 16px 20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.chips{grid-template-columns:repeat(2,1fr)}.time{font-size:1.9rem}.pill{padding:2px 9px;font-size:.92rem}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b aria-hidden="true">🔍</b><span>틀린 이모지 찾기</span></div>
  <button class="icon-btn" id="muteBtn" type="button" aria-label="효과음 끄기">🔊</button>
</header>

<main>
  <!-- HOME -->
  <section id="home" aria-labelledby="ttl">
    <h1 id="ttl"><span>틀린 이모지</span> 찾기!</h1>
    <p class="tag">똑같아 보이는 이모지 속 딱 하나 다른 놈, 찾을 수 있나요? 👀<br><small>다른 하나를 누르세요 · 정답 +1초 · 오답 −3초 · 제한시간 30초</small></p>
    <div class="demo" id="demo" aria-hidden="true"></div>

    <div class="banner" id="banner" hidden>
      <p id="bannerTxt"></p>
      <button class="btn" id="acceptBtn" type="button">🔥 도전 수락!</button>
    </div>

    <div class="panel">
      <h2 id="thLbl">테마 고르기</h2>
      <div class="chips" id="chips" role="group" aria-labelledby="thLbl"></div>
      <div class="row"><button class="btn block" id="startBtn" type="button">▶ 시작하기</button></div>
      <div class="row" style="margin-top:0"><button class="btn pink block" id="dailyBtn" type="button">📅 오늘의 챌린지</button></div>
      <p class="hint" id="dailyHint"></p>
    </div>

    <div class="panel">
      <h2 id="rankTtl">🏆 내 TOP 5</h2>
      <ol class="rank" id="rankList" aria-labelledby="rankTtl"></ol>
      <p class="hint muted">기록은 이 기기의 브라우저에만 저장돼요.</p>
    </div>
  </section>

  <!-- GAME -->
  <section id="game" hidden aria-label="게임 화면">
    <div class="hud">
      <span class="pill" id="stagePill">1단계</span>
      <div class="time" id="timeTxt" role="timer" aria-live="off">30.0</div>
      <span class="pill r" id="scorePill">0점</span>
    </div>
    <div class="bar" aria-hidden="true"><div id="barFill"></div></div>
    <div class="gridwrap">
      <div class="grid" id="grid" role="group" aria-label="이모지 격자. 하나만 다른 이모지를 찾아 누르세요. 방향키로 이동할 수 있어요"></div>
    </div>
    <div class="gamefoot">
      <span id="modeTxt"></span>
      <button class="link" id="quitBtn" type="button">그만두기</button>
    </div>
  </section>

  <!-- RESULT -->
  <section id="result" hidden aria-labelledby="gradeName">
    <div class="card" id="card">
      <div class="big" id="gradeEmoji" aria-hidden="true">🐥</div>
      <h2 id="gradeName">병아리 눈</h2>
      <p class="sub" id="gradeDesc"></p>
      <div class="score" id="finalScore">0점</div>
      <div>
        <span class="badge" id="finalStage">0단계</span>
        <span class="badge" id="finalTheme"></span>
      </div>
      <p class="sub" id="bestMsg"></p>
      <div class="vs" id="vsBox" hidden></div>
    </div>
    <div class="namebox">
      <label for="nick">닉네임(공유 카드용)</label>
      <input id="nick" type="text" maxlength="10" placeholder="나" autocomplete="nickname">
    </div>
    <div class="row">
      <button class="btn" id="shareBtn" type="button">🔗 도전장 보내기</button>
      <button class="btn alt" id="saveBtn" type="button">🖼️ 결과 카드 저장</button>
    </div>
    <div class="row" style="margin-top:0">
      <button class="btn pink" id="againBtn" type="button">🔁 한 번만 더!</button>
      <button class="btn alt" id="homeBtn" type="button">🏠 처음으로</button>
    </div>
  </section>
</main>

<footer>© <span id="yr">2026</span> 틀린 이모지 찾기 챌린지 · 눈이 번쩍 뜨이는 미니게임</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const SIZES=[4,4,5,5,6,6,7,7,8,8,9,9,10];
const START_TIME=30, MAX_TIME=40, PENALTY=3, BONUS=1;
const THEMES={
  faces:{name:'표정',icon:'😀',pairs:[['😀','😡'],['😂','😭'],['🙂','🙃'],['😊','😏'],['😐','😑'],['😠','😡'],['😃','😄'],['😄','😁'],['😕','😟'],['😢','😥'],['😶','😐'],['😀','😃']]},
  animals:{name:'동물',icon:'🐶',pairs:[['🐶','🐱'],['🐵','🙈'],['🐻','🐼'],['🐭','🐹'],['🐰','🐇'],['🐟','🐠'],['🐝','🐞'],['🐥','🐤'],['🐧','🐦'],['🐶','🐕'],['🐱','🐈'],['🐮','🐄']]},
  food:{name:'음식',icon:'🍔',pairs:[['🍎','🍅'],['🍋','🍌'],['🍓','🍒'],['🍊','🍑'],['🍎','🍏'],['🍞','🥖'],['🍩','🍪'],['🍙','🍚'],['🍉','🍈'],['🥔','🍠'],['🍔','🍟'],['🍏','🥝']]},
  hearts:{name:'하트',icon:'❤️',pairs:[['❤️','💙'],['💚','💜'],['🧡','💛'],['🖤','🤍'],['💗','💖'],['💓','💕'],['💘','💝'],['💛','🧡'],['💙','💜'],['💖','💗'],['💕','💞'],['🧡','🤎']]}
};
const KEYS=Object.keys(THEMES);
const GRADES=[
  {min:0,name:'병아리 눈',emoji:'🐥',desc:'아직 알에서 막 깬 눈! 다시 하면 분명 더 잘 보여요.'},
  {min:6,name:'독수리 눈',emoji:'🦅',desc:'꽤 날카로운데요? 숨은 그림도 잘 찾으시겠어요.'},
  {min:10,name:'매의 눈',emoji:'🎯',desc:'작은 차이도 놓치지 않는 진짜 눈썰미!'},
  {min:15,name:'사람이 아닌 눈',emoji:'👽',desc:'이건 사람의 눈이 아니에요. 인정합니다.'}
];
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const gradeOf=n=>{let g=GRADES[0];for(const x of GRADES)if(n>=x.min)g=x;return g};

/* state */
let selTheme=store.get('eoo.theme','faces'); if(!THEMES[selTheme])selTheme='faces';
let muted=store.get('eoo.mute',false);
let records=store.get('eoo.records',{});
if(!records||typeof records!=='object'||Array.isArray(records))records={};
let nick=store.get('eoo.nick','');
if(typeof nick!=='string')nick='';
let challenge=null;
let mode='normal',curTheme='faces',rng=Math.random;
let level=1,score=0,timeLeft=START_TIME,over=true,oddIdx=0,curN=4,stageStart=0,timer=null,lastTick=0,resultTimer=null;
let lastResult=null;

/* elements */
const screens={home:$('#home'),game:$('#game'),result:$('#result')};
const grid=$('#grid');
function show(n){for(const k in screens)screens[k].hidden=k!==n;window.scrollTo(0,0)}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}

/* sound */
let ac=null;
function tone(f,d,type,vol,delay){
  if(muted)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+(delay||0);
    o.type=type||'square';o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(vol||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02);
  }catch(e){}
}
const sfx={
  ok(){tone(660,.08,'square');tone(990,.12,'square',.06,.07)},
  bad(){tone(150,.25,'sawtooth',.09);try{if(navigator.vibrate)navigator.vibrate(80)}catch(e){}},
  start(){tone(440,.08);tone(660,.08,'square',.06,.08);tone(880,.14,'square',.06,.16)},
  end(){[784,659,523,392].forEach((f,i)=>tone(f,.18,'square',.07,i*.14))}
};
function paintMute(){const b=$('#muteBtn');b.textContent=muted?'🔇':'🔊';b.setAttribute('aria-label',muted?'효과음 켜기':'효과음 끄기')}
$('#muteBtn').addEventListener('click',()=>{muted=!muted;store.set('eoo.mute',muted);paintMute();if(!muted)sfx.ok()});

/* home */
function buildDemo(){
  const d=$('#demo');let h='';const odd=Math.floor(Math.random()*25);
  for(let i=0;i<25;i++)h+=`<i${i===odd?' class="odd"':''}>${i===odd?'🙂':'😀'}</i>`;
  d.innerHTML=h;
}
function renderChips(){
  $('#chips').innerHTML=KEYS.map(k=>`<button type="button" class="chip" data-k="${k}" aria-pressed="${k===selTheme}"><span class="e" aria-hidden="true">${THEMES[k].icon}</span>${THEMES[k].name}</button>`).join('');
}
$('#chips').addEventListener('click',e=>{
  const c=e.target.closest('.chip');if(!c)return;
  selTheme=c.dataset.k;store.set('eoo.theme',selTheme);renderChips();renderRank();
  const el=document.querySelector('.chip[data-k="'+selTheme+'"]');if(el)el.focus();
});
function fmtDate(iso){const p=String(iso||'').split('-');return p.length>=3?p[1]+'/'+p[2]:String(iso||'')}
function renderRank(){
  const list=Array.isArray(records[selTheme])?records[selTheme]:[];
  $('#rankTtl').textContent='🏆 내 TOP 5 · '+THEMES[selTheme].name;
  $('#rankList').innerHTML=list.length?list.map((r,i)=>`<li><span>${['🥇','🥈','🥉','4위','5위'][i]||''} <b>${Number(r.score)||0}점</b></span><span class="muted">${Number(r.stages)||0}단계 · ${fmtDate(r.date).replace(/[<>&"]/g,'')}</span></li>`).join(''):'<li><span>아직 기록이 없어요. 첫 기록을 남겨보세요!</span></li>';
  const dl=Array.isArray(records['daily:'+todayStr()])?records['daily:'+todayStr()]:[];
  const dt=dailyTheme();
  $('#dailyHint').textContent=`오늘의 테마는 ${THEMES[dt].icon} ${THEMES[dt].name}! 모두가 같은 판으로 겨뤄요.`+(dl.length?` 내 오늘 최고: ${Number(dl[0].score)||0}점 (${Number(dl[0].stages)||0}단계)`:'');
  $('#dailyBtn').textContent='📅 오늘의 챌린지 ('+fmtDate(todayStr())+')';
}
function dailyTheme(){return KEYS[hash('eoo-'+todayStr())%KEYS.length]}

/* challenge link */
function parseChallenge(){
  try{
    const q=new URLSearchParams(location.search);
    if(!q.has('c'))return;
    const sc=parseInt(q.get('c'),10),st=parseInt(q.get('s'),10),t=q.get('t');
    if(!(sc>=0&&sc<100000)||!(st>=0&&st<1000)||!THEMES[t])return;
    challenge={score:sc,stages:st,theme:t,mode:q.get('m')==='daily'?'daily':'normal',date:(q.get('d')||'').slice(0,10),name:(q.get('n')||'친구').slice(0,10)};
    const g=gradeOf(st);
    const daily=challenge.mode==='daily'&&challenge.date===todayStr();
    $('#bannerTxt').textContent=`🔥 ${challenge.name}님의 도전장! ${daily?'오늘의 챌린지':THEMES[t].name+' 테마'} ${st}단계 · ${sc}점 (${g.emoji} ${g.name}) — 이 점수 깰 수 있어?`;
    $('#banner').hidden=false;
    selTheme=t;
  }catch(e){}
}
$('#acceptBtn').addEventListener('click',()=>{
  if(!challenge)return;
  if(challenge.mode==='daily'&&challenge.date===todayStr())startGame('daily');
  else{selTheme=challenge.theme;startGame('normal')}
});

/* game */
$('#startBtn').addEventListener('click',()=>startGame('normal'));
$('#dailyBtn').addEventListener('click',()=>startGame('daily'));
$('#againBtn').addEventListener('click',()=>startGame(mode));
$('#homeBtn').addEventListener('click',()=>{renderChips();renderRank();show('home')});
$('#quitBtn').addEventListener('click',()=>{stopTimer();clearTimeout(resultTimer);over=true;renderChips();renderRank();show('home')});

function startGame(m){
  mode=m;
  clearTimeout(resultTimer);
  if(m==='daily'){const seed=hash('eoo-'+todayStr());rng=mulberry32(seed);curTheme=KEYS[seed%KEYS.length]}
  else{rng=Math.random;curTheme=selTheme}
  level=1;score=0;timeLeft=START_TIME;over=false;
  $('#modeTxt').textContent=(m==='daily'?'📅 오늘의 챌린지 · ':'')+THEMES[curTheme].icon+' '+THEMES[curTheme].name;
  show('game');sfx.start();
  buildStage();paintHud();
  stopTimer();lastTick=performance.now();timer=setInterval(tick,50);
}
function stopTimer(){if(timer){clearInterval(timer);timer=null}}
function buildStage(){
  const n=SIZES[Math.min(level-1,SIZES.length-1)];curN=n;
  const pairs=THEMES[curTheme].pairs;
  const idx=Math.round(Math.min(1,(level-1)/13)*(pairs.length-1));
  const j=Math.max(0,idx-(rng()<.5?1:0));
  let [a,b]=pairs[j];if(rng()<.5){const t=a;a=b;b=t}
  oddIdx=Math.floor(rng()*n*n);
  grid.style.setProperty('--n',n);
  let h='';
  for(let i=0;i<n*n;i++)h+=`<button type="button" class="cell" data-i="${i}" tabindex="${i===0?0:-1}">${i===oddIdx?b:a}</button>`;
  grid.innerHTML=h;
  stageStart=performance.now();
}
function paintHud(){
  $('#stagePill').textContent=level+'단계';
  $('#scorePill').textContent=score+'점';
  paintTime();
}
function paintTime(){
  const t=Math.max(0,timeLeft),el=$('#timeTxt');
  el.textContent=t.toFixed(1);
  el.classList.toggle('low',t<=5);
  const f=$('#barFill');f.style.width=Math.min(100,t/START_TIME*100)+'%';f.classList.toggle('low',t<=5);
}
function tick(){
  const now=performance.now();
  const dt=Math.min(.25,(now-lastTick)/1000);lastTick=now;
  if(over)return;
  timeLeft-=dt;paintTime();
  if(timeLeft<=0)endGame();
}
function floatMsg(txt){
  const w=document.querySelector('.gridwrap'),f=document.createElement('div');
  f.className='float';f.textContent=txt;w.appendChild(f);setTimeout(()=>f.remove(),800);
}
grid.addEventListener('focusin',e=>{
  const c=e.target.closest('.cell');if(!c)return;
  grid.querySelectorAll('.cell[tabindex="0"]').forEach(x=>{if(x!==c)x.tabIndex=-1});
  c.tabIndex=0;
});
grid.addEventListener('click',e=>{
  const c=e.target.closest('.cell');if(!c||over)return;
  const kb=e.detail===0;
  if(+c.dataset.i===oddIdx){
    const sec=(performance.now()-stageStart)/1000;
    const gain=100+Math.max(0,Math.round((6-sec)*10));
    score+=gain;level++;timeLeft=Math.min(MAX_TIME,timeLeft+BONUS);
    sfx.ok();floatMsg('+'+gain+' ⏱+1');
    grid.classList.remove('ok');void grid.offsetWidth;grid.classList.add('ok');
    buildStage();paintHud();
    if(kb&&grid.firstElementChild)grid.firstElementChild.focus({preventScroll:true});
  }else{
    timeLeft-=PENALTY;sfx.bad();
    c.classList.add('wrong');setTimeout(()=>c.classList.remove('wrong'),450);
    grid.classList.remove('shake');void grid.offsetWidth;grid.classList.add('shake');
    const el=$('#timeTxt');el.classList.remove('hit');void el.offsetWidth;el.classList.add('hit');
    floatMsg('−'+PENALTY+'초');
    paintTime();
    if(timeLeft<=0)endGame();
  }
});
grid.addEventListener('keydown',e=>{
  const d={ArrowLeft:-1,ArrowRight:1,ArrowUp:-curN,ArrowDown:curN}[e.key];
  if(!d)return;
  const cur=document.activeElement;if(!cur||cur.dataset.i===undefined)return;
  e.preventDefault();
  let i=+cur.dataset.i+d;
  if(i<0||i>=curN*curN)return;
  if((e.key==='ArrowLeft'&&+cur.dataset.i%curN===0)||(e.key==='ArrowRight'&&+cur.dataset.i%curN===curN-1))return;
  grid.children[i].focus();
});

function endGame(){
  if(over)return;
  over=true;stopTimer();paintTime();sfx.end();
  const stages=level-1;
  const cells=grid.querySelectorAll('.cell');
  if(cells[oddIdx])cells[oddIdx].classList.add('wrong');
  clearTimeout(resultTimer);
  resultTimer=setTimeout(()=>showResult(stages),700);
}
function showResult(stages){
  const g=gradeOf(stages);
  const key=mode==='daily'?'daily:'+todayStr():curTheme;
  const list=Array.isArray(records[key])?records[key]:[];
  const entry={score,stages,date:todayStr()};
  let rank=-1,prevBest=list.length?(Number(list[0].score)||0):0;
  if(score>0){
    list.push(entry);list.sort((a,b)=>(Number(b.score)||0)-(Number(a.score)||0));
    records[key]=list.slice(0,5);rank=records[key].indexOf(entry);
    store.set('eoo.records',records);
  }
  lastResult={score,stages,theme:curTheme,mode,date:todayStr(),grade:g};
  $('#gradeEmoji').textContent=g.emoji;
  $('#gradeName').textContent=g.name;
  $('#gradeDesc').textContent=g.desc;
  $('#finalScore').textContent=score+'점';
  $('#finalStage').textContent=stages+'단계 클리어';
  $('#finalTheme').textContent=(mode==='daily'?'📅 오늘의 챌린지 · ':'')+THEMES[curTheme].icon+' '+THEMES[curTheme].name;
  let msg;
  if(score===0)msg='아쉬워요! 첫 단계부터 다시 도전해봐요.';
  else if(rank===0&&score>prevBest)msg=prevBest?`🎉 새 최고 기록! (이전 ${prevBest}점)`:'🎉 첫 기록 등록!';
  else if(rank>0)msg=`내 TOP 5 중 ${rank+1}위! (최고 ${list[0].score}점)`;
  else msg=`내 최고 기록은 ${list[0]?list[0].score:0}점이에요.`;
  $('#bestMsg').textContent=msg;
  const vs=$('#vsBox');
  let comparable=false;
  if(challenge){
    if(challenge.mode==='daily'&&challenge.date===todayStr())comparable=(mode==='daily');
    else comparable=(mode==='normal'&&curTheme===challenge.theme);
  }
  if(comparable){
    const diff=score-challenge.score;
    vs.hidden=false;
    vs.textContent=diff>0?`🏆 ${challenge.name}님의 ${challenge.score}점을 ${diff}점 차로 이겼어요!`:diff===0?`🤝 ${challenge.name}님과 ${challenge.score}점으로 동점!`:`😤 ${challenge.name}님(${challenge.score}점)에게 ${-diff}점 부족해요. 재도전!`;
  }else vs.hidden=true;
  $('#nick').value=nick;
  show('result');
  $('#gradeName').setAttribute('tabindex','-1');$('#gradeName').focus({preventScroll:true});
}
$('#nick').addEventListener('input',e=>{nick=e.target.value.trim().slice(0,10);store.set('eoo.nick',nick)});

/* share */
function shareUrl(){
  const r=lastResult;
  const base=location.href.split('#')[0].split('?')[0];
  const p=new URLSearchParams({c:r.score,s:r.stages,t:r.theme,m:r.mode==='daily'?'daily':'n',d:r.date});
  if(nick)p.set('n',nick);
  return base+'?'+p.toString();
}
$('#shareBtn').addEventListener('click',async()=>{
  if(!lastResult)return;
  const r=lastResult,who=nick||'나';
  const text=`${r.grade.emoji} ${who}의 눈은 「${r.grade.name}」! 틀린 이모지 찾기 ${r.stages}단계 · ${r.score}점. 이 점수 깰 수 있어? 👀`;
  const url=shareUrl();
  if(navigator.share){
    try{await navigator.share({title:'틀린 이모지 찾기 챌린지',text,url});return}
    catch(e){if(e&&e.name==='AbortError')return}
  }
  try{await navigator.clipboard.writeText(text+'\n'+url);toast('도전장 링크를 복사했어요! 친구에게 붙여넣기 📋')}
  catch(e){window.prompt('아래 내용을 복사해 친구에게 보내세요',text+'\n'+url)}
});

/* card image */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
async function drawCard(){
  try{await document.fonts.load('40px Jua')}catch(e){}
  const W=720,H=960,cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const c=cv.getContext('2d'),F='"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif',E='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  const r=lastResult;
  c.fillStyle='#FFB400';c.fillRect(0,0,W,H);
  c.fillStyle='rgba(255,255,255,.35)';
  for(let y=20,row=0;y<H;y+=48,row++)for(let x=(row%2)*24+10;x<W;x+=48){c.beginPath();c.arc(x,y,4,0,7);c.fill()}
  c.fillStyle='#2B1B00';rr(c,58,76,620,820,44);c.fill();
  c.fillStyle='#fff';c.strokeStyle='#2B1B00';c.lineWidth=8;rr(c,50,60,620,820,44);c.fill();c.stroke();
  c.textAlign='center';c.fillStyle='#2B1B00';
  c.font='46px '+F;c.fillText('틀린 이모지 찾기 챌린지',W/2,140,560);
  c.font='170px '+E;c.fillText(r.grade.emoji,W/2,350);
  c.font='84px '+F;c.fillText(r.grade.name,W/2,470,560);
  c.fillStyle='#FFB400';c.strokeStyle='#2B1B00';c.lineWidth=10;c.lineJoin='round';
  c.font='150px '+F;c.strokeText(r.score+'점',W/2,620,560);c.fillText(r.score+'점',W/2,620,560);
  c.fillStyle='#2B1B00';c.font='46px '+F;
  c.fillText(r.stages+'단계 클리어',W/2,694,560);
  c.font='36px '+F;
  c.fillText((r.mode==='daily'?'📅 오늘의 챌린지 · ':'')+THEMES[r.theme].name+' 테마 · '+fmtDate(r.date),W/2,750,560);
  c.fillText((nick||'나')+'의 기록',W/2,800,560);
  c.fillStyle='#D6336C';rr(c,150,822,420,44,22);c.fill();
  c.fillStyle='#fff';c.font='30px '+F;c.fillText('이 점수 깰 수 있어? 👀',W/2,854,400);
  c.fillStyle='#2B1B00';c.font='26px '+F;c.fillText('© '+new Date().getFullYear()+' 틀린 이모지 찾기 챌린지',W/2,925,600);
  return cv;
}
$('#saveBtn').addEventListener('click',async()=>{
  if(!lastResult)return;
  const cv=await drawCard();
  cv.toBlob(b=>{
    if(!b){toast('이미지를 만들지 못했어요');return}
    const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download='emoji-odd-one-out-'+lastResult.score+'.png';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    toast('결과 카드를 저장했어요 🖼️');
  },'image/png');
});

/* init */
$('#yr').textContent=new Date().getFullYear();
paintMute();buildDemo();parseChallenge();renderChips();renderRank();
})();
</script>
